[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunting-agent"
version = "0.1.0"
description = "Daily resume-driven job search, ATS scoring, and application assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
docs = [
  "pypdf>=4.0",
  "python-docx>=1.1",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
